name: Refresh Instagram token

# Instagram long-lived tokens expire after 60 days. This renews it twice a month
# and saves the new one back into the IG_ACCESS_TOKEN secret.
on:
  schedule:
    - cron: "0 3 1,15 * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: refresh
        run: npm run refresh-token
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      - name: Save the new token
        run: gh secret set IG_ACCESS_TOKEN --body "$TOKEN" --repo "${{ github.repository }}"
        env:
          TOKEN: ${{ steps.refresh.outputs.token }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
