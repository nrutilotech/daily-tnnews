name: Refresh Instagram token

# Instagram long-lived tokens expire after 60 days. This renews it twice a month
# and saves the new one back into the IG_ACCESS_TOKEN secret (needs the GH_PAT secret:
# a fine-grained GitHub token for this repo with "Secrets: Read and write").
on:
  schedule:
    - cron: "0 3 1,15 * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ask Instagram for a renewed token
        run: npm run refresh-token
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      - name: Save the new token
        # the token is read from a private temp file, so it never appears in the log
        run: gh secret set IG_ACCESS_TOKEN --repo "${{ github.repository }}" < "$RUNNER_TEMP/ig_token"
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
      - name: Clean up
        if: always()
        run: rm -f "$RUNNER_TEMP/ig_token"
