name: Finish the latest edition (Story and Threads)

# Use this if a "Post news" run reached Instagram but its Story or its Threads post failed: it posts
# whichever is missing for the latest edition. Nothing that is already posted is ever posted again.
on:
  workflow_dispatch:

permissions:
  contents: write

# never at the same time as a "Post news" run
concurrency:
  group: post-news
  cancel-in-progress: false

jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BRAND_NAME: ${{ vars.BRAND_NAME || 'DAILY TNNEWS' }}
      INSTAGRAM_HANDLE: ${{ vars.INSTAGRAM_HANDLE || '@dailytnnews' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Post the missing Story / Threads post
        run: node src/main.js finish
        env:
          MEDIA_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/media
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_GRAPH_HOST: ${{ vars.IG_GRAPH_HOST || 'graph.instagram.com' }}
          POST_STORY: ${{ vars.POST_STORY || 'true' }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}

      - name: Remember what was posted
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/history.json
          git diff --cached --quiet && exit 0
          git commit -qm "history: finished the latest edition"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q && exit 0
            sleep 5
          done
          echo "::warning::Could not save state/history.json"
