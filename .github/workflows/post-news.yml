name: Post news

on:
  # GitHub often starts scheduled runs late and, when busy, can drop one altogether. Each edition has
  # two backup times; if an earlier run already posted, a backup run sees that and stops at once.
  schedule:
    - cron: "25 1 * * *"   # 6:55 AM IST (post appears around 7:00)
    - cron: "10 2 * * *"   # 7:40 AM IST backup
    - cron: "5 3 * * *"    # 8:35 AM IST backup
    - cron: "25 13 * * *"  # 6:55 PM IST
    - cron: "10 14 * * *"  # 7:40 PM IST backup
    - cron: "5 15 * * *"   # 8:35 PM IST backup
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only build the slides (download them from the run page) — don't post"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: post-news
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DRY_RUN: ${{ (inputs.dry_run || vars.DRY_RUN == 'true') && 'true' || 'false' }}
      BRAND_NAME: ${{ vars.BRAND_NAME || 'DAILY TNNEWS' }}
      INSTAGRAM_HANDLE: ${{ vars.INSTAGRAM_HANDLE || '@dailytnnews' }}
      NEWS_LANGUAGE: ${{ vars.NEWS_LANGUAGE || 'en' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # a backup or late scheduled run stops here if the edition is already out (saves Gemini quota)
      - name: Is an edition due?
        id: due
        run: node src/main.js due

      - name: Self-check (offline tests; nothing is posted if these fail)
        if: steps.due.outputs.due == 'true'
        run: npm test

      - name: Build slides (news feeds + Gemini + photos)
        if: steps.due.outputs.due == 'true'
        run: npm run build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          SOURCE_PHOTOS: ${{ vars.SOURCE_PHOTOS || 'false' }}

      - name: Keep a copy of the slides on the run page
        if: always() && steps.due.outputs.due == 'true'
        uses: actions/upload-artifact@v6
        with:
          if-no-files-found: ignore
          name: slides
          path: out/
          retention-days: 7

      # Instagram downloads images from a public URL, so the slides are pushed to a
      # "media" branch that only ever holds the latest post (no history piles up).
      - name: Host slides on the media branch
        if: env.DRY_RUN != 'true' && steps.due.outputs.due == 'true'
        env:
          PUSH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          ID=$(jq -r .id out/post.json)
          mkdir -p "/tmp/media/$ID" && cp out/*.jpg "/tmp/media/$ID/"
          cd /tmp/media
          git init -q -b media
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "slides $ID"
          git push -q -f "https://x-access-token:${PUSH_TOKEN}@github.com/${REPO}.git" media

      - name: Post to Instagram
        if: steps.due.outputs.due == 'true'
        run: npm run post
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_GRAPH_HOST: ${{ vars.IG_GRAPH_HOST || 'graph.instagram.com' }}
          MEDIA_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/media
          POST_STORY: ${{ vars.POST_STORY || 'true' }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}

      - name: Remember what was posted (avoids repeats; feeds the news page)
        if: env.DRY_RUN != 'true' && steps.due.outputs.due == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/history.json state/editions.json 2>/dev/null || git add state/history.json
          git diff --cached --quiet && exit 0
          git commit -qm "history: $(jq -r .id out/post.json)"
          # main may have moved on during the run (e.g. a code update): rebase and retry
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q && exit 0
            sleep 5
          done
          echo "::warning::Could not save state/history.json; the next edition may repeat some stories"
